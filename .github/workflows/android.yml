name: Build Release APK

on:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # 注意：不要加已下架的 tools 包，否则 sdkmanager 会报错退出
        packages: platform-tools platforms;android-34 build-tools;34.0.0

    - uses: gradle/actions/setup-gradle@v3

    - run: ./gradlew assembleRelease

    - name: Sign app APK
      id: sign_app
      uses: ilharp/sign-android-release@nightly
      with:
        releaseDir: app/build/outputs/apk/release
        signingKey: ${{ secrets.SIGNING_KEY }}
        keyAlias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: signed-apks
        path: app/build/outputs/apk/release/*-arm64-v8a-release-signed.apk
        if-no-files-found: error
        retention-days: 20

  # 构建失败时推送到手机（ntfy）：手机装 ntfy App 并订阅 tide-build-7f3a9c 即可收到
  notify-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: curl -d "Tide 构建失败（${{ github.workflow }}），去 Actions 看日志" ntfy.sh/tide-build-7f3a9c
