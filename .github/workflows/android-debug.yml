name: Build Debug APK

# 调试用：debug 包自带签名，可直接安装，先验证动画效果
# 正式发布仍用 Build Release APK（需配置签名 secrets）

on:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # 注意：不要加已下架的 tools 包，否则 sdkmanager 会报错退出
        packages: platform-tools platforms;android-34 build-tools;34.0.0

    - uses: gradle/actions/setup-gradle@v3

    - run: ./gradlew assembleDebug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*-arm64-v8a-debug.apk
        if-no-files-found: error
        retention-days: 20

  # 构建失败时推送到手机（ntfy）：手机装 ntfy App 并订阅 tide-build-7f3a9c 即可收到
  notify-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: curl -d "Tide 构建失败（${{ github.workflow }}），去 Actions 看日志" ntfy.sh/tide-build-7f3a9c
